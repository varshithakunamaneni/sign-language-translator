# Calm neutral backgrounds; Violet Dusk (#502D55 #935073 #F6DBC0) used only as accents.
# Day = [theme.light], Night = [theme.dark] (switch with the Day / Night buttons in the app)
[theme.light]
primaryColor = "#935073"
backgroundColor = "#FAFAF7"
secondaryBackgroundColor = "#F1F0EC"
textColor = "#26222A"

[theme.dark]
primaryColor = "#F6DBC0"
backgroundColor = "#18171B"
secondaryBackgroundColor = "#222126"
textColor = "#F4F2EE"

[server]
# Photo uploads / camera snapshots fail with "403" on Streamlit Cloud in some browsers
# (e.g. Safari) because of this check. Our app has no logins or private data, so it is safe to turn off.
enableXsrfProtection = false
maxUploadSize = 10
# Serve ./static as plain files (sign photos and word GIFs load reliably and are cached)
enableStaticServing = true
